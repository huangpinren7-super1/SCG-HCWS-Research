schema: scg-hcws-resident-profile-v2
bootloops_ref: 66b680ce742e654cfe86da4f072a69061fe182b1
purpose: frequently used local BootLoops layer for SCG-HCWS
policy: common Python exact/high-precision stack plus explicit external engine lanes

tiers:
  exact_core: [annihilator, ansatzer, rankscreen, winnow, ratfit, lockpick, vopclose, qinvert]
  certified_numeric: [baller, eras, nestor, longhand, ellipticus, gpl-eval, clinch, posq]
  structure_geometry: [dipstick, landau-alphabet, holonomic, geotriage, coalescer, wayfinder, famhar, maxcut]
  physics_backend: [seedling, cosmoflow, membound, subtropica, surd, formglue]

engine_requirements:
  python: [mpmath, sympy, numpy, scipy, python-flint, gmpy2, pyyaml, networkx, dynesty, cypari2, msprime, tskit, moments-popgen, pySecDec, pytest]
  system: [gp, gphelp, msolve, Singular, sage, julia]
  headers: [/usr/include/flint/flint.h, /usr/include/ginac/ginac.h]
  optional_binaries: [redg1, fitrel, fflowcli]

notes:
  - Data-gated reference banks are never fabricated.
  - GitHub-hosted runners may still lack cgroup delegation for memory probes.
  - BootLoops BATTERIES.json remains the execution authority.
