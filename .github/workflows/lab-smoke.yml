name: BootLoops-Lab Infrastructure Smoke

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "bootloops_lab/**"
      - "gateway/**"
      - "bootloops-lab/**"
      - "experiments/**"
      - "certificates/**"
      - "schemas/**"
      - "reference/**"
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: BootLoops-Lab Infrastructure Smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout pinned BootLoops
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: BootLoops-ai/bootloops
          ref: 66b680ce742e654cfe86da4f072a69061fe182b1
          path: vendor/bootloops
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install canonical locked Python layer
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r bootloops-lab/local/requirements-ci.txt

      - name: Static catalog/interface smoke
        run: |
          python -m pytest bootloops_lab gateway -q
          python -m bootloops_lab.cli --bootloops-root vendor/bootloops catalog > /tmp/catalog.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/catalog.json"))
          assert len(d) == 49
          print("catalog entries:", len(d))
          print("interface smoke: PASS")
          PY

      - name: Gateway import smoke
        run: |
          python - <<'PY'
          import gateway
          import bootloops_lab
          print("gateway import: PASS")
          print("bootloops_lab import: PASS")
          PY

      - name: Truth-injected finite-algebra benchmark
        run: |
          python bootloops-lab/scripts/test_toolchain_truth.py --bootloops-root vendor/bootloops

      - name: Shell syntax smoke
        run: |
          bash -n bootloops-lab/local/bootstrap.sh
          bash -n bootloops-lab/local/doctor.sh
          echo "bootstrap/doctor shell syntax: PASS"
