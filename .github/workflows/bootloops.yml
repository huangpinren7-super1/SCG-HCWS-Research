name: BootLoops Acceptance Battery

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'bootloops-lab/**'
      - 'bootloops_lab/**'
      - 'gateway/**'
      - 'experiments/**'
      - 'certificates/**'
      - 'schemas/**'
      - 'reference/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'
  BOOTLOOPS_REF: '66b680ce742e654cfe86da4f072a69061fe182b1'
  BOOTLOOPS_STANDARD_TIMEOUT: '300'
  BOOTLOOPS_DOGTAG_TIMEOUT: '360'
  BOOTLOOPS_ABACUS_TIMEOUT: '1200'

jobs:
  acceptance:
    name: BootLoops 49-package acceptance battery
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout research lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout pinned BootLoops
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: BootLoops-ai/bootloops
          ref: 66b680ce742e654cfe86da4f072a69061fe182b1
          path: vendor/bootloops
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Set up Julia
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: '1.11'
      - name: Pin research Python executable
        run: |
          set -euo pipefail
          export RESEARCH_PYTHON="$pythonLocation/bin/python"
          test -x "$RESEARCH_PYTHON"
          "$RESEARCH_PYTHON" --version
          echo "RESEARCH_PYTHON=$RESEARCH_PYTHON" >> "$GITHUB_ENV"
      - name: Record exact BootLoops checkout
        run: |
          set -euo pipefail
          ACTUAL_BOOTLOOPS_REF=$(git -C vendor/bootloops rev-parse HEAD)
          test "$ACTUAL_BOOTLOOPS_REF" = "$BOOTLOOPS_REF"
          echo "BOOTLOOPS_REF_ACTUAL=$ACTUAL_BOOTLOOPS_REF" >> "$GITHUB_ENV"
          echo "BootLoops checkout: $ACTUAL_BOOTLOOPS_REF"
      - name: Install system mathematics prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential g++ gfortran cmake make pkg-config m4 uuid-dev git unzip wget curl bzip2 ca-certificates libgmp-dev libmpfr-dev libmpc-dev pari-gp pari-doc perl libpari-dev libflint-dev libginac-dev msolve singular
      - name: Verify system mathematics engines
        run: |
          set -euo pipefail
          command -v gp; command -v gphelp; gp --version
          command -v msolve; msolve --version || true
          command -v Singular; Singular --version || true
          test -f /usr/include/flint/flint.h; test -f /usr/include/ginac/ginac.h
          ldconfig -p | grep -q 'libginac'
          echo 'PARI / FLINT / GiNaC / msolve / Singular: PASS'
      - name: Install SageMath 10.7
        run: |
          set -euo pipefail
          MINIFORGE="$HOME/miniforge3"
          MINIFORGE_VERSION='26.7.2-0'
          MINIFORGE_URL="https://github.com/conda-forge/miniforge/releases/download/$MINIFORGE_VERSION/Miniforge3-$MINIFORGE_VERSION-Linux-x86_64.sh"
          MINIFORGE_SHA256='281b0ac7d550802efc81af633225a5e6116d29ae72f3ab4eae7168c3931a4c05'
          if [ ! -x "$MINIFORGE/bin/conda" ]; then
            curl -L --fail --retry 3 -o "$RUNNER_TEMP/miniforge.sh" "$MINIFORGE_URL"
            echo "$MINIFORGE_SHA256  $RUNNER_TEMP/miniforge.sh" | sha256sum -c -
            bash "$RUNNER_TEMP/miniforge.sh" -b -p "$MINIFORGE"
          fi
          "$MINIFORGE/bin/conda" config --system --set channel_priority strict
          "$MINIFORGE/bin/conda" create -y -n sage sage=10.7 python=3.11
          ORE_ALGEBRA_REF='e9d5d9515f2e804fbe9a41e0a2652d1467f4386d'
          "$MINIFORGE/envs/sage/bin/sage" -pip install --no-build-isolation "git+https://github.com/mkauers/ore_algebra.git@$ORE_ALGEBRA_REF"
          echo "$MINIFORGE/envs/sage/bin" >> "$GITHUB_PATH"
          echo "SAGE_HOME=$MINIFORGE/envs/sage" >> "$GITHUB_ENV"
          echo "HOLONOMIC_SAGE=$MINIFORGE/envs/sage/bin/sage" >> "$GITHUB_ENV"
          echo "ORE_ALGEBRA_REF=$ORE_ALGEBRA_REF" >> "$GITHUB_ENV"
          "$MINIFORGE/envs/sage/bin/sage" --version
          "$MINIFORGE/envs/sage/bin/sage" -python - <<'PY'
          import sage.all, ore_algebra
          print('SageMath + ore_algebra: PASS')
          PY
      - name: Install canonical Python command shims
        run: |
          set -euo pipefail
          SHIM_DIR="$RUNNER_TEMP/research-python-shims"
          mkdir -p "$SHIM_DIR"
          printf '#!/usr/bin/env bash\nexec "%s" "$@"\n' "$RESEARCH_PYTHON" > "$SHIM_DIR/python"
          cp "$SHIM_DIR/python" "$SHIM_DIR/python3"
          chmod 755 "$SHIM_DIR/python" "$SHIM_DIR/python3"
          echo "PATH=$SHIM_DIR:$(dirname "$RESEARCH_PYTHON"):$PATH" >> "$GITHUB_ENV"
          echo "RESEARCH_PYTHON_SHIM_DIR=$SHIM_DIR" >> "$GITHUB_ENV"

      - name: Verify canonical Python resolution
        run: |
          set -euo pipefail
          /usr/bin/env PATH="$RESEARCH_PYTHON_SHIM_DIR:$(dirname "$RESEARCH_PYTHON"):$PATH" /usr/bin/which python3
          /usr/bin/env PATH="$RESEARCH_PYTHON_SHIM_DIR:$(dirname "$RESEARCH_PYTHON"):$PATH" /usr/bin/which python
          /bin/sh -c 'python3 -c "import sys; print(sys.executable)"'
          /bin/sh -c 'python -c "import sys; print(sys.executable)"'
          /bin/sh -c 'test "$(python3 -c "import sys; print(sys.executable)")" = "$RESEARCH_PYTHON"'
          /bin/sh -c 'test "$(python -c "import sys; print(sys.executable)")" = "$RESEARCH_PYTHON"'
          echo "Python command resolution: PASS"

      - name: Prepare Oscar/JSON Julia environment for dipstick
        run: |
          set -euo pipefail
          DIPSTICK_PROJECT="$RUNNER_TEMP/dipstick-oscar"; rm -rf "$DIPSTICK_PROJECT"; mkdir -p "$DIPSTICK_PROJECT"
          cat > "$DIPSTICK_PROJECT/Project.toml" <<'TOML'
          name = "DipstickOscar"
          uuid = "7f4b6f4c-4d2c-4d25-a8d7-5a0d8d5e7b11"
          version = "0.1.0"
          [deps]
          JSON = "682c06a0-de6a-54ab-a142-c8b1cf79cde6"
          Oscar = "f1435218-dba5-11e9-1e4d-f1a5fab5fc13"
          [compat]
          Oscar = "1.7"
          julia = "1.11"
          TOML
          julia --project="$DIPSTICK_PROJECT" -e 'using Pkg; Pkg.instantiate()'
          echo "DIPSTICK_JULIA_PROJECT=$DIPSTICK_PROJECT" >> "$GITHUB_ENV"
          echo 'Dipstick Oscar/JSON project: PASS'
      - name: Install Python scientific stack
        run: |
          set -euo pipefail
          "$RESEARCH_PYTHON" -m pip install --disable-pip-version-check -r "$GITHUB_WORKSPACE/bootloops-lab/local/requirements-ci.txt"
      - name: Verify Python scientific stack
        run: |
          set -euo pipefail
          "$RESEARCH_PYTHON" - <<'PY'
          from importlib.metadata import version
          import sys, mpmath, sympy, numpy, scipy, flint, gmpy2, yaml, jsonschema, networkx, dynesty, cypari2, msprime, tskit
          print('Python:', sys.version)
          for pkg in ('python-flint','cypari2','msprime','tskit','moments-popgen','pySecDec','jsonschema'): print(pkg, version(pkg))
          print('scientific core imports: PASS')
          PY
      - name: Preflight every in-repo Julia project
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            dir=$(dirname "$project")
            echo "[Julia instantiate] $dir"
            ok=0
            for attempt in 1 2 3; do
              echo "  attempt=$attempt"
              if JULIA_PKG_SERVER=https://pkg.julialang.org                  julia --project="$dir" -e 'using Pkg; Pkg.instantiate()'; then
                ok=1
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "  instantiate failed; retrying after transient registry/artifact failure"
                sleep 5
              fi
            done
            test "$ok" -eq 1
          done < <(find vendor/bootloops/tools -name Project.toml -print | sort)
          echo 'Julia manifest preflight: PASS (all projects instantiated on an explicit 3-attempt retry budget)'
      - name: Build BootLoops Blade engine
        env:
          BLADE_REF: '1013a7578a0f71783ab141f680a17115b3b88fe5'
          FFLOW_REF: 'b951bf7361643292ae3846383281e5f4626dad78'
        run: |
          set -euo pipefail
          FFPREFIX="$RUNNER_TEMP/finiteflow"; mkdir -p "$RUNNER_TEMP/fflow-src"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/fflow.zip" "https://github.com/peraro/finiteflow/archive/$FFLOW_REF.zip"
          unzip -q "$RUNNER_TEMP/fflow.zip" -d "$RUNNER_TEMP/fflow-src"
          FFDIR="$RUNNER_TEMP/fflow-src/finiteflow-$FFLOW_REF"
          export CC=/usr/bin/gcc
          export CXX=/usr/bin/g++
          export CMAKE_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/lib:$FFPREFIX/lib
          export CMAKE_INCLUDE_PATH=/usr/include:/usr/local/include:$FFPREFIX/include
          cmake -S "$FFDIR" -B "$FFDIR/build" -DCMAKE_INSTALL_PREFIX="$FFPREFIX" -DCMAKE_C_COMPILER=/usr/bin/gcc -DCMAKE_CXX_COMPILER=/usr/bin/g++ -DCMAKE_PREFIX_PATH="/usr;/usr/local;$FFPREFIX" -DCMAKE_LIBRARY_PATH="/usr/lib/x86_64-linux-gnu;/usr/lib;$FFPREFIX/lib" -DCMAKE_INCLUDE_PATH="/usr/include;/usr/local/include;$FFPREFIX/include"
          cmake --build "$FFDIR/build" --parallel 2
          cmake --install "$FFDIR/build"
          git clone --depth 1 'https://github.com/BootLoops-ai/blade.git' vendor/blade
          git -C vendor/blade fetch --depth 1 origin "$BLADE_REF"; git -C vendor/blade checkout "$BLADE_REF"
          sed -i "s|^DFFLOWMLINK_DIR=.*|DFFLOWMLINK_DIR=\"$FFPREFIX\"|" vendor/blade/install.in.txt
          sed -i "s|^DCMAKE_PREFIX_PATH=.*|DCMAKE_PREFIX_PATH=\"/usr;/usr/local;$FFPREFIX\"|" vendor/blade/install.in.txt
          cmake -S vendor/blade -B vendor/blade/build -DCMAKE_C_COMPILER=/usr/bin/gcc -DCMAKE_CXX_COMPILER=/usr/bin/g++ -DCMAKE_PREFIX_PATH="/usr;/usr/local;$FFPREFIX" -DCMAKE_LIBRARY_PATH="/usr/lib/x86_64-linux-gnu;/usr/lib;$FFPREFIX/lib" -DCMAKE_INCLUDE_PATH="/usr/include;/usr/local/include;$FFPREFIX/include"
          cmake --build vendor/blade/build --parallel 2
          cmake --install vendor/blade/build
          test -x vendor/blade/bin/redg1; test -x vendor/blade/bin/fitrel; test -x vendor/blade/bin/fflowcli; test -x vendor/blade/bin/dumppoints
          BLADE_LD_LIBRARY_PATH="$FFPREFIX/lib:$GITHUB_WORKSPACE/vendor/blade/lib"
          export LD_LIBRARY_PATH="$BLADE_LD_LIBRARY_PATH:${LD_LIBRARY_PATH:-}"
          for exe in redg1 fitrel recmod dynamicrr dumppoints fflowcli fflowcli_stream ssolve; do
            ldd "vendor/blade/bin/$exe" > "$RUNNER_TEMP/ldd-$exe.txt"
            if grep -q "not found" "$RUNNER_TEMP/ldd-$exe.txt"; then
              echo "Blade dynamic-link failure for $exe"
              cat "$RUNNER_TEMP/ldd-$exe.txt"
              exit 1
            fi
          done
          "$RESEARCH_PYTHON" - <<'PY'
          import importlib.util
          import sys
          import sysconfig
          import flint
          print("research Python:", sys.executable)
          print("SOABI:", sysconfig.get_config_var("SOABI"))
          print("python-flint:", flint.__file__)
          assert importlib.util.find_spec("blade") is not None
          PY
          PYTHONPATH="$GITHUB_WORKSPACE/vendor/bootloops/tools" "$RESEARCH_PYTHON" -c 'import blade, blade.pipeline; print("Blade Python layer: PASS")'
          echo "BLADE_BIN_DIR=$GITHUB_WORKSPACE/vendor/blade/bin" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$BLADE_LD_LIBRARY_PATH:$GITHUB_WORKSPACE/vendor/blade/lib" >> "$GITHUB_ENV"
          echo 'Blade engine build + runtime linkage preflight: PASS'
          echo 'Disclosure: the Blade install template is locally parameterized for this runner prefix; vendor/blade source files are not changed.'
      - name: Configure optional reference/data banks
        shell: bash
        run: |
          set -euo pipefail
          has_payload(){ local d="$1"; [ -d "$d" ] && find "$d" -type f ! -name README.md -print -quit | grep -q .; }
          if has_payload "$GITHUB_WORKSPACE/reference/clinch"; then echo "CLINCH_REFERENCE_DIR=$GITHUB_WORKSPACE/reference/clinch" >> "$GITHUB_ENV"; fi
          if [ -f "$GITHUB_WORKSPACE/reference/eichler/true.json" ]; then echo "G2KIT_TRUE_JSON=$GITHUB_WORKSPACE/reference/eichler/true.json" >> "$GITHUB_ENV"; fi
          if has_payload "$GITHUB_WORKSPACE/reference/galois"; then echo "GALOIS_CAMPAIGN_BANK=$GITHUB_WORKSPACE/reference/galois" >> "$GITHUB_ENV"; fi
          if has_payload "$GITHUB_WORKSPACE/reference/blade-port"; then echo "BLADE_PORT_ROOT=$GITHUB_WORKSPACE/reference/blade-port" >> "$GITHUB_ENV"; fi
      - name: Run canonical 49-package acceptance battery
        working-directory: vendor/bootloops
        run: |
          set -euo pipefail
          "$RESEARCH_PYTHON" "$GITHUB_WORKSPACE/bootloops-lab/scripts/run_canonical_battery.py"             --root .             --par 4             --standard-timeout "$BOOTLOOPS_STANDARD_TIMEOUT"             --dogtag-timeout "$BOOTLOOPS_DOGTAG_TIMEOUT"             --abacus-timeout "$BOOTLOOPS_ABACUS_TIMEOUT" | tee bootloops-lab-selftest.log
          test -f selftest_results.json
      - name: Write acceptance provenance receipt
        if: always()
        run: |
          set -euo pipefail
          "$RESEARCH_PYTHON" bootloops-lab/scripts/write_acceptance_receipt.py \
            --root vendor/bootloops \
            --result vendor/bootloops/selftest_results.json \
            --out bootloops-lab-acceptance-receipt.json \
            --research-ref "$GITHUB_SHA" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --par 4 \
            --standard-timeout "$BOOTLOOPS_STANDARD_TIMEOUT" \
            --dogtag-timeout "$BOOTLOOPS_DOGTAG_TIMEOUT" \
            --abacus-timeout "$BOOTLOOPS_ABACUS_TIMEOUT"

      - name: Check expected baseline
        run: |
          set -euo pipefail
          "$RESEARCH_PYTHON" bootloops-lab/scripts/check_expected_selftests.py vendor/bootloops/selftest_results.json bootloops-lab/config/expected-selftests.json --allow-provisional
      - name: Capture Python environment
        if: always()
        run: |
          "$RESEARCH_PYTHON" -m pip freeze | sort > bootloops-pip-freeze.txt
      - name: Generate acceptance report
        if: always()
        run: |
          if [ -f vendor/bootloops/selftest_results.json ]; then "$RESEARCH_PYTHON" bootloops-lab/scripts/summarize_selftests.py vendor/bootloops/selftest_results.json | tee bootloops-lab-acceptance-summary.md; else printf '%s\n' '# BootLoops-Lab acceptance summary' '' 'selftest_results.json was not produced.' | tee bootloops-lab-acceptance-summary.md; fi
      - name: Publish job summary
        if: always()
        run: |
          cat bootloops-lab-acceptance-summary.md >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"
          echo '## Environment' >> "$GITHUB_STEP_SUMMARY"
          echo "- BootLoops ref: $BOOTLOOPS_REF_ACTUAL" >> "$GITHUB_STEP_SUMMARY"
          echo '- Runner: Ubuntu 24.04' >> "$GITHUB_STEP_SUMMARY"
          echo "- Python: $($RESEARCH_PYTHON --version)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Julia: $(julia --version)" >> "$GITHUB_STEP_SUMMARY"
          if command -v sage >/dev/null 2>&1; then echo "- Sage: $(sage --version)" >> "$GITHUB_STEP_SUMMARY"; else echo '- Sage: unavailable (setup step did not complete)' >> "$GITHUB_STEP_SUMMARY"; fi
          echo "- Sage ore_algebra ref: ${ORE_ALGEBRA_REF:-unavailable}" >> "$GITHUB_STEP_SUMMARY"
          echo '- pip freeze captured: bootloops-pip-freeze.txt' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bootloops-acceptance-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            vendor/bootloops/selftest_results.json
            vendor/bootloops/bootloops-lab-selftest.log
            bootloops-lab-acceptance-summary.md
            bootloops-lab-acceptance-receipt.json
            bootloops-pip-freeze.txt
