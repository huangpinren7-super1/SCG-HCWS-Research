name: BootLoops-Lab Weekly Drift Monitor

on:
  schedule:
    - cron: '37 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootloops-lab-weekly-drift
  cancel-in-progress: true

jobs:
  drift:
    name: BootLoops-Lab weekly drift monitor
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: BootLoops-ai/bootloops
          ref: 66b680ce742e654cfe86da4f072a69061fe182b1
          path: vendor/bootloops
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install system prerequisite for locked Python layer
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pari-gp pari-doc libpari-dev
      - name: Install locked Python layer
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r bootloops-lab/local/requirements-ci.txt
      - name: Fingerprint runner and pinned checkout
        run: |
          set -euo pipefail
          {
            echo "timestamp=$(date -u +%FT%TZ)"
            echo "runner_os=ubuntu-24.04"
            echo "python=$(python --version 2>&1)"
            echo "bootloops=$(git -C vendor/bootloops rev-parse HEAD)"
            echo "registry=$(grep '^bootloops_ref:' gateway/registry.yaml | awk '{print $2}')"
            echo
            echo "[python]"
            python -m pip freeze
            echo
            echo "[apt]"
            dpkg-query -W -f='${binary:Package}=${Version}\n' build-essential cmake g++ gfortran libgmp-dev libmpfr-dev libmpc-dev pari-gp libpari-dev libflint-dev libginac-dev msolve singular 2>/dev/null || true
            echo
            echo "[engines]"
            for cmd in gp gphelp msolve Singular; do
              if command -v "$cmd" >/dev/null 2>&1; then
                echo "$cmd=$($cmd --version 2>&1 | head -n 1)"
              else
                echo "$cmd=UNAVAILABLE"
              fi
            done
          } > drift-fingerprint.txt
      - name: Upload drift fingerprint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bootloops-lab-drift-${{ github.run_id }}
          path: drift-fingerprint.txt
