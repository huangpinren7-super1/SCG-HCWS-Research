name: BootLoops Abacus Rescue

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/abacus-rescue.yml'

permissions:
  contents: read

concurrency:
  group: bootloops-abacus-rescue
  cancel-in-progress: true

env:
  BOOTLOOPS_REF: '66b680ce742e654cfe86da4f072a69061fe182b1'
  ABACUS_TIMEOUT: '1200'
  PYTHONUNBUFFERED: '1'

jobs:
  abacus:
    name: Abacus acceptance (extended timeout)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout pinned BootLoops
        uses: actions/checkout@v4
        with:
          repository: BootLoops-ai/bootloops
          ref: 66b680ce742e654cfe86da4f072a69061fe182b1
          path: vendor/bootloops
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: '1.11'

      - name: Install Abacus prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential g++ gfortran pkg-config \
            libgmp-dev libmpfr-dev libmpc-dev \
            pari-gp pari-doc perl libpari-dev libflint-dev
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            mpmath sympy numpy scipy python-flint==0.9.0 \
            gmpy2 pyyaml networkx dynesty cypari2==2.2.2 pytest

      - name: Verify exact BootLoops checkout
        working-directory: vendor/bootloops
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$BOOTLOOPS_REF"
          echo "BootLoops checkout: $actual"

      - name: Run Abacus only with 1200s timeout
        working-directory: vendor/bootloops
        run: |
          set -euo pipefail
          python run_selftests.py abacus --timeout "$ABACUS_TIMEOUT" | tee abacus-rescue.log
          test -f selftest_results.json

      - name: Assert Abacus PASS
        if: always()
        working-directory: vendor/bootloops
        run: |
          set -euo pipefail
          test -f selftest_results.json
          python - <<'PY'
          import json
          record = json.load(open('selftest_results.json', encoding='utf-8')).get('abacus', {})
          print(json.dumps(record, indent=2))
          assert record.get('status') == 'PASS', f"abacus status={record.get('status')!r}"
          PY

      - name: Publish Abacus result
        if: always()
        run: |
          echo '# Abacus rescue run' >> "$GITHUB_STEP_SUMMARY"
          echo "- BootLoops ref: $BOOTLOOPS_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "- Timeout: $ABACUS_TIMEOUT s" >> "$GITHUB_STEP_SUMMARY"
          if [ -f vendor/bootloops/selftest_results.json ]; then
            cat vendor/bootloops/selftest_results.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Abacus evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bootloops-abacus-rescue-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            vendor/bootloops/selftest_results.json
            vendor/bootloops/abacus-rescue.log
